<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Jaideep Kundu — Backend &amp; Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#302b63" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <style>
    .name { font: 700 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .tag  { font: 500 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e0f7fb; letter-spacing: 1px; }
  </style>

  <!-- background block with a wavy bottom edge -->
  <path fill="url(#bg)" d="M0,0 H1200 V160 C1050,210 900,120 750,160 C600,200 450,130 300,165 C180,190 80,170 0,155 Z"/>

  <!-- moving translucent wave -->
  <path fill="url(#wave2)" d="M0,150 C200,190 400,120 600,160 C800,200 1000,130 1200,165 V220 H0 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,150 C200,190 400,120 600,160 C800,200 1000,130 1200,165 V220 H0 Z;
              M0,165 C200,130 400,195 600,150 C800,115 1000,190 1200,150 V220 H0 Z;
              M0,150 C200,190 400,120 600,160 C800,200 1000,130 1200,165 V220 H0 Z"/>
  </path>

  <text class="name" x="600" y="88" text-anchor="middle">Jaideep Kundu<animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/></text>
  <text class="tag" x="600" y="126" text-anchor="middle">Backend &amp; Systems Engineer  •  CS @ VIT-AP '27<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="1.8s" fill="freeze"/></text>
</svg>
